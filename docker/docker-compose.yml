services:
  # KRaft mode: every node is both broker and controller, no ZooKeeper.
  kafka-1:
    image: confluentinc/cp-kafka:8.4.0
    container_name: ticketbus-kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29096,2@kafka-2:29097,3@kafka-3:29098
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29096,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 6nUKGFu3cFoTyP64LCSxMA
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka1_kraft_data:/var/lib/kafka/data
    networks:
      - ticketbus-network

  kafka-2:
    image: confluentinc/cp-kafka:8.4.0
    container_name: ticketbus-kafka-2
    ports:
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29096,2@kafka-2:29097,3@kafka-3:29098
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29093,CONTROLLER://0.0.0.0:29097,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 6nUKGFu3cFoTyP64LCSxMA
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka2_kraft_data:/var/lib/kafka/data
    networks:
      - ticketbus-network

  kafka-3:
    image: confluentinc/cp-kafka:8.4.0
    container_name: ticketbus-kafka-3
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29096,2@kafka-2:29097,3@kafka-3:29098
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29094,CONTROLLER://0.0.0.0:29098,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29094,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 6nUKGFu3cFoTyP64LCSxMA
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka3_kraft_data:/var/lib/kafka/data
    networks:
      - ticketbus-network

  postgres-auth:
    image: postgres:16-alpine
    container_name: ticketbus-postgres-auth
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ticketbus
      POSTGRES_PASSWORD: ticketbus
      POSTGRES_DB: auth_db
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    networks:
      - ticketbus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketbus -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-ticketing:
    image: postgres:16-alpine
    container_name: ticketbus-postgres-ticketing
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ticketbus
      POSTGRES_PASSWORD: ticketbus
      POSTGRES_DB: ticketing_db
    volumes:
      - pg_ticketing_data:/var/lib/postgresql/data
    networks:
      - ticketbus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketbus -d ticketing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:16-alpine
    container_name: ticketbus-postgres-payment
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ticketbus
      POSTGRES_PASSWORD: ticketbus
      POSTGRES_DB: payment_db
    volumes:
      - pg_pay_data:/var/lib/postgresql/data
    networks:
      - ticketbus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketbus -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  traefik:
    image: traefik:v3.3
    container_name: ticketbus-traefik
    ports:
      - "8000:8000"
      - "8085:8085"
    volumes:
      - ../traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ticketbus-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ticketbus-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - ticketbus-network

volumes:
  kafka1_kraft_data:
  kafka2_kraft_data:
  kafka3_kraft_data:
  pg_auth_data:
  pg_ticketing_data:
  pg_pay_data:

networks:
  ticketbus-network:
    driver: bridge
