name: Deploy

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
  workflow_dispatch:
    inputs:
      push:
        description: Push images to the registry
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build & Push (${{ matrix.service }})
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [auth, ticketing, payment, mail]
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve build mode
        id: mode
        run: |
          # act always builds locally: never log in or push from a workstation.
          if [[ "${ACT:-}" == "true" || "${{ github.event.inputs.push }}" == "false" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tags
        id: tags
        run: |
          if [[ "${{ steps.mode.outputs.push }}" == "false" ]]; then
            echo "TAGS=ticketbus/${{ matrix.service }}-service:local" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD="${{ github.event.workflow_run.head_sha || github.sha }}"
          # GHCR image names must be lowercase; GITHUB_REPOSITORY is owner/repo.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}-service"

          TAG=$(git tag --points-at "$HEAD" --list "v*" | head -1)
          if [[ -n "$TAG" ]]; then
            VERSION="${TAG#v}"
            echo "TAGS=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            SHA=$(echo "$HEAD" | cut -c1-7)
            echo "TAGS=${IMAGE}:latest,${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v4
        if: ${{ steps.mode.outputs.push == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image locally (no push)
        if: ${{ steps.mode.outputs.push == 'false' }}
        run: >
          docker build
          -f docker/Dockerfile
          --build-arg SERVICE=${{ matrix.service }}
          -t ${{ steps.tags.outputs.TAGS }}
          .

      - uses: docker/build-push-action@v7
        if: ${{ steps.mode.outputs.push == 'true' }}
        with:
          context: .
          file: docker/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}

  deploy-migrate:
    name: Build & Push migrate image
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve build mode
        id: mode
        run: |
          # act always builds locally: never log in or push from a workstation.
          if [[ "${ACT:-}" == "true" || "${{ github.event.inputs.push }}" == "false" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tags
        id: tags
        run: |
          if [[ "${{ steps.mode.outputs.push }}" == "false" ]]; then
            echo "TAGS=ticketbus/ticketbus-migrations:local" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD="${{ github.event.workflow_run.head_sha || github.sha }}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/ticketbus-migrations"

          TAG=$(git tag --points-at "$HEAD" --list "v*" | head -1)
          if [[ -n "$TAG" ]]; then
            VERSION="${TAG#v}"
            echo "TAGS=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            SHA=$(echo "$HEAD" | cut -c1-7)
            echo "TAGS=${IMAGE}:latest,${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v4
        if: ${{ steps.mode.outputs.push == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build migrate image locally (no push)
        if: ${{ steps.mode.outputs.push == 'false' }}
        run: >
          docker build
          -f docker/migrate.Dockerfile
          -t ${{ steps.tags.outputs.TAGS }}
          .

      - uses: docker/build-push-action@v7
        if: ${{ steps.mode.outputs.push == 'true' }}
        with:
          context: .
          file: docker/migrate.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}
