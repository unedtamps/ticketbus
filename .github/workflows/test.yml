name: Test

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go test -race -count=1 ./...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: >
          go test -tags=integration -race -count=1 -v
          ./service/auth/tests/integration/...
          ./service/ticketing/tests/integration/...
          ./service/payment/tests/integration/...
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tests/e2e/go.sum

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      # Brings up Postgres, Kafka and Traefik, runs the black-box suite against
      # the gateway on :8100, then tears the stack down even when a test fails.
      #
      # act runs the job against the host Docker daemon, so Compose bind mounts
      # must resolve to host paths. The make act-* targets set HOST_REPO_ROOT to
      # the real repo path; on GitHub it is unset and GITHUB_WORKSPACE is
      # already a host path.
      - name: Run e2e suite
        run: |
          cd "${HOST_REPO_ROOT:-$GITHUB_WORKSPACE}"
          make e2e
