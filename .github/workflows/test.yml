name: Test

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go test -race -count=1 ./...

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: >
          go test -tags=integration -race -count=1 -v
          ./service/auth/tests/integration/...
          ./service/ticketing/tests/integration/...
          ./service/payment/tests/integration/...
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tests/e2e/go.sum

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      # Brings up Postgres, Kafka and Traefik, runs the black-box suite against
      # the gateway on :8100, then tears the stack down even when a test fails.
      - run: make e2e
