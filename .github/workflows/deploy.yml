name: Deploy

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
  workflow_dispatch:
    inputs:
      push:
        description: Push images to the registry
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    name: Build & Push (${{ matrix.service }})
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [auth, ticketing, payment, mail]
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve build mode
        id: mode
        run: |
          # act always builds locally: never log in or push from a workstation.
          if [[ "${ACT:-}" == "true" || "${{ github.event.inputs.push }}" == "false" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tags
        id: tags
        run: |
          if [[ "${{ steps.mode.outputs.push }}" == "false" ]]; then
            echo "TAGS=ticketbus/${{ matrix.service }}-service:local" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD="${{ github.event.workflow_run.head_sha || github.sha }}"
          # GHCR image names must be lowercase; GITHUB_REPOSITORY is owner/repo.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}-service"

          TAG=$(git tag --points-at "$HEAD" --list "v*" | head -1)
          if [[ -n "$TAG" ]]; then
            VERSION="${TAG#v}"
            echo "TAGS=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            SHA=$(echo "$HEAD" | cut -c1-7)
            echo "TAGS=${IMAGE}:latest,${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v4
        if: ${{ steps.mode.outputs.push == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image locally (no push)
        if: ${{ steps.mode.outputs.push == 'false' }}
        run: >
          docker build
          -f docker/Dockerfile
          --build-arg SERVICE=${{ matrix.service }}
          -t ${{ steps.tags.outputs.TAGS }}
          .

      - uses: docker/build-push-action@v7
        if: ${{ steps.mode.outputs.push == 'true' }}
        with:
          context: .
          file: docker/Dockerfile
          build-args: SERVICE=${{ matrix.service }}
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}

  deploy-web:
    name: Build & Push web
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Baked into the client bundle and used by server components. Set the
      # repository variable to override it for your deployed API.
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.unedotampubolon.com' }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve build mode
        id: mode
        run: |
          # act always builds locally: never log in or push from a workstation.
          if [[ "${ACT:-}" == "true" || "${{ github.event.inputs.push }}" == "false" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tags
        id: tags
        run: |
          if [[ "${{ steps.mode.outputs.push }}" == "false" ]]; then
            echo "TAGS=ticketbus/web:local" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD="${{ github.event.workflow_run.head_sha || github.sha }}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/web"

          TAG=$(git tag --points-at "$HEAD" --list "v*" | head -1)
          if [[ -n "$TAG" ]]; then
            VERSION="${TAG#v}"
            echo "TAGS=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            SHA=$(echo "$HEAD" | cut -c1-7)
            echo "TAGS=${IMAGE}:latest,${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v4
        if: ${{ steps.mode.outputs.push == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image locally (no push)
        if: ${{ steps.mode.outputs.push == 'false' }}
        run: >
          docker build
          -f docker/web.Dockerfile
          --build-arg NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
          -t ${{ steps.tags.outputs.TAGS }}
          .

      - uses: docker/build-push-action@v7
        if: ${{ steps.mode.outputs.push == 'true' }}
        with:
          context: .
          file: docker/web.Dockerfile
          build-args: NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}

  deploy-migrate:
    name: Build & Push migrate image
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        if: ${{ env.ACT != 'true' }}
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve build mode
        id: mode
        run: |
          # act always builds locally: never log in or push from a workstation.
          if [[ "${ACT:-}" == "true" || "${{ github.event.inputs.push }}" == "false" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tags
        id: tags
        run: |
          if [[ "${{ steps.mode.outputs.push }}" == "false" ]]; then
            echo "TAGS=ticketbus/ticketbus-migrations:local" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD="${{ github.event.workflow_run.head_sha || github.sha }}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/ticketbus-migrations"

          TAG=$(git tag --points-at "$HEAD" --list "v*" | head -1)
          if [[ -n "$TAG" ]]; then
            VERSION="${TAG#v}"
            echo "TAGS=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            SHA=$(echo "$HEAD" | cut -c1-7)
            echo "TAGS=${IMAGE}:latest,${IMAGE}:${SHA}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v4
        if: ${{ steps.mode.outputs.push == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build migrate image locally (no push)
        if: ${{ steps.mode.outputs.push == 'false' }}
        run: >
          docker build
          -f docker/migrate.Dockerfile
          -t ${{ steps.tags.outputs.TAGS }}
          .

      - uses: docker/build-push-action@v7
        if: ${{ steps.mode.outputs.push == 'true' }}
        with:
          context: .
          file: docker/migrate.Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}

  # Opens a PR against unedtamps/aws after all GHCR images are published.
  # CD_TOKEN needs Contents: read/write and Pull requests: read/write on that
  # repository (or a classic PAT with repo scope).
  deploy-kustomize:
    name: Open AWS dev overlay PR
    needs: [deploy, deploy-web, deploy-migrate]
    if: ${{ (github.event_name == 'workflow_run' || github.event.inputs.push == 'true') && github.actor != 'nektos/act' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout TicketBus
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Resolve image tag
        id: image
        run: |
          HEAD="${{ github.event.workflow_run.head_sha || github.sha }}"
          TAG=$(git tag --points-at "$HEAD" --list "v*" | head -1)
          if [[ -n "$TAG" ]]; then
            TAG="${TAG#v}"
          else
            TAG=$(echo "$HEAD" | cut -c1-7)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout AWS manifests
        uses: actions/checkout@v7
        with:
          repository: unedtamps/aws
          ref: master
          token: ${{ secrets.CD_TOKEN }}
          path: aws
          fetch-depth: 0

      - name: Update ticketbus dev image tags
        env:
          NEW_TAG: ${{ steps.image.outputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("aws/aws_kube/k8s/apps/ticketbus/overlays/dev/kustomization.yaml")
          tag = os.environ["NEW_TAG"]
          lines = path.read_text().splitlines()
          out = []
          image = None
          for line in lines:
              match = re.match(r"^(\s*-\s*name:\s*)(\S+)\s*$", line)
              if match:
                  image = match.group(2)
                  out.append(line)
                  continue
              if image and re.match(r"^\s*newTag:", line):
                  indent = line[:len(line) - len(line.lstrip())]
                  out.append(f'{indent}newTag: "{tag}"')
                  image = None
                  continue
              out.append(line)
          path.write_text("\n".join(out) + "\n")
          PY
          git -C aws diff --stat

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.CD_TOKEN }}
          NEW_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          cd aws
          if git diff --quiet; then
            echo "AWS overlay already at $NEW_TAG; no PR needed"
            exit 0
          fi

          branch="ci/ticketbus-${NEW_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add aws_kube/k8s/apps/ticketbus/overlays/dev/kustomization.yaml
          git commit -m "chore(ticketbus): deploy ${NEW_TAG}"
          git push --force origin "$branch"

          if gh pr list --repo unedtamps/aws --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "PR already open for $branch"
            exit 0
          fi

          body=$(printf 'Updates the ticketbus-dev image tags to `%s`.\n\nSource: %s/%s/actions/runs/%s' \
            "$NEW_TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh pr create \
            --repo unedtamps/aws \
            --base master \
            --head "$branch" \
            --title "chore(ticketbus): deploy ${NEW_TAG}" \
            --body "$body"
