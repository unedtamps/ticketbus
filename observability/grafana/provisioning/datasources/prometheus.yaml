apiVersion: 1

# Provisioned so PromQL works in Grafana immediately. Metrics arrive at the
# collector over OTLP and are scraped from there, so Prometheus needs no
# knowledge of the individual services.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false
    jsonData:
      # The collector is the only scrape target, so exemplars and exemplars
      # storage stay off; the collector does not support them.
      httpMethod: POST
      timeInterval: 15s