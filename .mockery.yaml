template: testify
filename: "mock_{{.InterfaceName}}.go"
packages:
  github.com/nedo/TicketSaas/service/auth/internal/domain:
    config:
      structname: Mock{{.InterfaceName}}
      dir: "{{.InterfaceDir}}/mocks"
      pkgname: mocks
    interfaces:
      UserRepository:
      RefreshTokenRepository:
      PasswordHasher:
      TokenService:
  github.com/nedo/TicketSaas/service/ticketing/internal/domain:
    config:
      structname: Mock{{.InterfaceName}}
      dir: "{{.InterfaceDir}}/mocks"
      pkgname: mocks
    interfaces:
      EventRepository:
      SeatReader:
      BookingRepository:
      SeatCounter:
      EventConsumer:
      EventStatusRepository:
      PaymentClient:
  github.com/nedo/TicketSaas/service/payment/internal/domain:
    config:
      structname: Mock{{.InterfaceName}}
      dir: "{{.InterfaceDir}}/mocks"
      pkgname: mocks
    interfaces:
      TransactionRepository:
      RefundRepository:
      PaymentProcessor:
      EventConsumer:
