# OpenTelemetry Collector — the single ingest point for all three signals.
#
# Logs come from two places: dev services run as host processes via `make dev-*`
# and tee their slog JSON into logs/<service>.log, which `file_log` tails, and
# anything that speaks OTLP logs. Traces and metrics arrive over OTLP only.
#
# Adding Docker container logs (infra + the e2e stack) is deliberately left out
# for now — that needs a root-only bind mount, so it is a separate step.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

  # Host-run service logs. These files are bare slog JSON, so there is no
  # container envelope to unwrap — only the JSON body needs parsing.
  #
  # `on_error: drop` is load-bearing, not defensive noise. Because `tee` merges
  # stderr into the same file, the stream also contains non-JSON lines: direnv's
  # "loading .envrc" notice, `exit status N` from `go run`, and chi's plain-text
  # access log. Without drop, the first such line fails json_parser, the
  # following move operator then fails too, and the file consumer stops reading
  # that file entirely — taking every valid log line down with it.
  file_log:
    include:
      - /repo/logs/*.log
    # Read from the start of each file. This costs a duplicate re-ingest of the
    # retained logs every time the collector restarts, but the alternative is
    # worse: with `start_at: end`, a file whose content was already written
    # before the poller discovered it is skipped entirely — so a service that
    # crashes during startup logs nothing at all, which is precisely the case
    # you most want to see. Duplicates are cheap in Loki; missing logs are not.
    # Use `make obs-clean` to discard the Loki volume and start fresh.
    start_at: beginning
    poll_interval: 200ms
    operators:
      - type: json_parser
        parse_from: body
        parse_to: attributes
        on_error: drop
      # slog attaches the service name as an attribute; promote it to a
      # resource attribute so Loki exposes it as the `service_name` index
      # label, matching what Grafana's Explore expects.
      - type: move
        from: attributes["service"]
        to: resource["service.name"]
        on_error: drop

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 20
  batch: {}

exporters:
  # Loki's native OTLP endpoint. Anything not promoted to an index label is kept
  # as structured metadata, so log fields stay queryable without re-parsing.
  otlp_http:
    endpoint: http://loki:3100/otlp

  # Traces produced by the services. Tempo is reached over the observability
  # network, so its OTLP ports are never published to the host.
  otlp_http/tempo:
    endpoint: http://tempo:4318

  # Metrics are exposed for Prometheus to scrape. All three services share this
  # one endpoint, so service.name has to survive as a label — without it the
  # series from auth, ticketing and payment would be indistinguishable.
  #
  # Port 9464 is deliberately not published to the host: Prometheus reaches it
  # over the observability network, so there is no reason to expose it on the
  # developer's machine.
  prometheus:
    endpoint: 0.0.0.0:9464
    # Pinned rather than left to the default so the names in the README's PromQL
    # examples cannot drift: dots become underscores and unit/type suffixes are
    # appended, giving http_server_request_duration_seconds and
    # http_server_request_count_total.
    translation_strategy: UnderscoreEscapingWithSuffixes
    resource_constant_labels:
      included: ["*"]

service:
  pipelines:
    logs:
      receivers: [otlp, file_log]
      processors: [memory_limiter, batch]
      exporters: [otlp_http]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
