# Traefik dynamic configuration — routers, services, middlewares

http:
  middlewares:
    cors:
      headers:
        accessControlAllowOriginList:
          - http://localhost:3000
          # Same dev server reached by IP. Browsers treat this as a distinct
          # origin, so it needs its own entry; credentials mode rules out "*".
          - http://127.0.0.1:3000
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
        accessControlAllowCredentials: true
        accessControlMaxAge: 86400

    ratelimit:
      rateLimit:
        average: 30000
        period: 1m
        burst: 6000

    forward-auth:
      forwardAuth:
        address: http://host.docker.internal:8081/api/auth/verify
        authResponseHeaders:
          - X-Authenticated-User-ID
          - X-Authenticated-User-Role
          - X-Authenticated-User-Email

  services:
    auth:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:8081

    ticketing:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:8082

    payment:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:8083

  routers:
    auth:
      rule: PathPrefix(`/api/auth`)
      service: auth
      middlewares:
        - cors
        - ratelimit
      priority: 20

    event-protected:
      rule: PathPrefix(`/api/events`)
      service: ticketing
      middlewares:
        - cors
        - ratelimit
        - forward-auth
      priority: 10


    event-payout:
      rule: PathRegexp(`^/api/events/[^/]+/payout$`)
      service: ticketing
      middlewares:
        - cors
        - ratelimit
        - forward-auth
      priority: 30

    event-public:
      rule: PathPrefix(`/api/events`) && Method(`GET`) && !Path(`/api/events/mine`) && !Path(`/api/events/pending`) && !Path(`/api/events/organizers`) && !Path(`/api/events/organizers/me`)
      service: ticketing
      middlewares:
        - cors
        - ratelimit
      priority: 20


    payout-account:
      rule: PathPrefix(`/api/payout-account`)
      service: ticketing
      middlewares:
        - cors
        - ratelimit
        - forward-auth
      priority: 20

    refund-account:
      rule: PathPrefix(`/api/refund-account`)
      service: payment
      middlewares:
        - cors
        - ratelimit
        - forward-auth
      priority: 20

    refunds:
      rule: PathPrefix(`/api/refunds`)
      service: payment
      middlewares:
        - cors
        - ratelimit
        - forward-auth
      priority: 20

    bookings:
      rule: PathPrefix(`/api/bookings`)
      service: ticketing
      middlewares:
        - cors
        - ratelimit
        - forward-auth
      priority: 20

    payment-webhook:
      rule: PathPrefix(`/api/payments/webhook`)
      service: payment
      middlewares:
        - cors
        - ratelimit
      priority: 30

    admin-events:
      rule: PathPrefix(`/api/admin/events`)
      service: ticketing
      middlewares:
        - cors
        - ratelimit
        - forward-auth
      priority: 20

    admin-refunds:
      rule: PathPrefix(`/api/admin/refunds`)
      service: payment
      middlewares:
        - cors
        - ratelimit
        - forward-auth
      priority: 20

    admin-payouts:
      rule: PathPrefix(`/api/admin/payouts`)
      service: ticketing
      middlewares:
        - cors
        - ratelimit
        - forward-auth
      priority: 20

    payments:
      rule: PathPrefix(`/api/payments`) && !PathPrefix(`/api/payments/internal`) && !PathPrefix(`/api/payments/booking/mock`) && !PathPrefix(`/api/payments/payout/mock`)
      service: payment
      middlewares:
        - cors
        - ratelimit
        - forward-auth
      priority: 20
