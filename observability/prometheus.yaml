# Prometheus — local scrape config for the collector's metrics endpoint.
#
# Services push metrics over OTLP like every other signal; only the collector is
# scraped. That keeps a single ingestion path and means adding a metrics backend
# later is a collector change, not an application change.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: ticketsaas-dev

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["collector:9464"]